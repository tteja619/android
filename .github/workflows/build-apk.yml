name: Build Custom Net-Merge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Go from golib/go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: golib/go.mod

      - name: Configure Android SDK and NDK
        run: |
          NDK_PATH=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n 1)
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Run Go engine tests
        working-directory: golib
        run: go test ./...

      - name: Build Go engine (.aar)
        run: |
          chmod +x scripts/build-go.sh
          ./scripts/build-go.sh

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netmerge-custom-apk
          path: app/build/outputs/apk/debug/*.apk
